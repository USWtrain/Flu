px;\" placeholder=\"Drop a photo showing ice packs and vaccine boxes\" src=\"b491388b-70ac-4329-80d0-c7816cf1e057\"><\u002Fimage-slot>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSection.returns }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin-bottom:10px;\">FLU-13 · END OF EVENT<\u002Fspan>\n        <h1 style=\"font-size:28px;margin:0 0 18px;\">Returning Vaccine &amp; Supplies<\u002Fh1>\n        <p><b>Vaccine:<\u002Fb> once your clinic ends, repack your cooler to the state it arrived in.<\u002Fp>\n        <ul>\n          <li>Unused vaccine goes back in the cooler.<\u002Fli>\n          <li>Ice packs surround the vaccine on the sides and bottom.<\u002Fli>\n        <\u002Ful>\n        <p>Each flu vaccine shipment includes a next-day air label.<\u002Fp>\n        <ul>\n          <li>Ship the cooler back on the next-day air label immediately after clinic — unless your event falls on Friday, Saturday, or Sunday.<\u002Fli>\n          <li>If your event is Friday–Sunday, hold vaccine (refrigerated, with ice packs in the freezer) until Monday for shipment.<\u002Fli>\n        <\u002Ful>\n        <p><b>Paperwork:<\u002Fb> your shipment includes a small UPS box for paperwork, already labeled for return. Complete the Event Data Sheet, place it on top of the paperwork, seal the box, and drop it at UPS with your vaccine.<\u002Fp>\n        <p><b>Dry supplies:<\u002Fb> place the Ground UPS return label on the outside of the dry supplies box. Seal and drop at UPS along with vaccine and paperwork.<\u002Fp>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSection.shippingchart2 }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin-bottom:10px;\">FLU-14 · REFERENCE<\u002Fspan>\n        <h1 style=\"font-size:28px;margin:0 0 18px;\">US Wellness Flu Shipping Chart<\u002Fh1>\n        <sc-raw-table class=\"table\">\n          <sc-raw-tr><sc-raw-th>Day<\u002Fsc-raw-th><sc-raw-th>Ship<\u002Fsc-raw-th><sc-raw-th>Notes<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Monday<\u002Fsc-raw-td><sc-raw-td>✓<\u002Fsc-raw-td><sc-raw-td>If your event takes place on Monday, ship vaccine back same day.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Tuesday<\u002Fsc-raw-td><sc-raw-td>✓<\u002Fsc-raw-td><sc-raw-td>If your event takes place on Tuesday, ship vaccine back same day.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Wednesday<\u002Fsc-raw-td><sc-raw-td>✓<\u002Fsc-raw-td><sc-raw-td>If your event takes place on Wednesday, ship vaccine back same day.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Thursday<\u002Fsc-raw-td><sc-raw-td>✓<\u002Fsc-raw-td><sc-raw-td>If your event takes place on Thursday, ship vaccine back same day.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Friday<\u002Fsc-raw-td><sc-raw-td>✕<\u002Fsc-raw-td><sc-raw-td>No flu vaccine should be shipped back on Friday.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Saturday<\u002Fsc-raw-td><sc-raw-td>✕<\u002Fsc-raw-td><sc-raw-td>No flu vaccine should be shipped back on Saturday.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Sunday<\u002Fsc-raw-td><sc-raw-td>✕<\u002Fsc-raw-td><sc-raw-td>No flu vaccine should be shipped back on Sunday.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-table>\n        <div class=\"card\" style=\"margin:16px 0;background:var(--color-accent-2-100);\"><span class=\"card-kicker\" style=\"color:var(--color-accent-2-700);\">Important<\u002Fspan><p class=\"card-body\" style=\"color:var(--color-accent-2-800);opacity:1;\">If your event takes place Friday–Sunday, or UPS will be closed when your event ends: please ensure you store vaccine correctly at your residence.<\u002Fp><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSection.support }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin-bottom:10px;\">FLU-15 · KEEP HANDY<\u002Fspan>\n        <h1 style=\"font-size:28px;margin:0 0 18px;\">Support &amp; Emergency Contacts<\u002Fh1>\n        <p>Temperature card issues, missing supplies, Salesforce access, or any day-of-clinic question:<\u002Fp>\n        <div class=\"card\" style=\"text-align:center;padding:24px;\"><span style=\"font-size:20px;letter-spacing:.03em;color:var(--color-accent-700);font-weight:600;\">US Wellness On-Call — 866-881-7607<\u002Fspan><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSection.quiz }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin-bottom:10px;\">KNOWLEDGE CHECK<\u002Fspan>\n        <h1 style=\"font-size:28px;margin:0 0 18px;\">Before You Work Your First Clinic<\u002Fh1>\n        <p style=\"color:color-mix(in srgb, var(--color-text) 78%, transparent);margin:0 0 20px;\">Answer all 9 questions. You can retry any question until you get it right.<\u002Fp>\n        <div style=\"font-size:14px;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin-bottom:8px;\">{{ correctCount }} / {{ totalQuestions }}<\u002Fdiv>\n        <div style=\"height:6px;background:var(--color-divider);border-radius:100px;overflow:hidden;margin-bottom:22px;\"><div style=\"height:100%;width:{{ progressPct }};background:var(--color-accent);transition:width .3s ease;\"><\u002Fdiv><\u002Fdiv>\n        <sc-for list=\"{{ questions }}\" as=\"q\" hint-placeholder-count=\"9\">\n          <div class=\"card\" style=\"padding:18px 20px;margin-bottom:14px;\">\n            <p style=\"font-weight:600;font-size:15px;margin:0 0 12px;\">{{ q.qNumber }}. {{ q.qText }}<\u002Fp>\n            <sc-for list=\"{{ q.options }}\" as=\"opt\" hint-placeholder-count=\"3\">\n              <button type=\"button\" style=\"{{ opt.style }}\" disabled=\"{{ opt.disabled }}\" sc-camel-on-click=\"{{ opt.onClick }}\">{{ opt.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"{{ scoreBannerStyle }}\">{{ scoreBannerText }}<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSection.certificate }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin-bottom:10px;\">WRAP-UP<\u002Fspan>\n        <h1 style=\"font-size:28px;margin:0 0 18px;\">Certificate of Completion<\u002Fh1>\n        <p style=\"color:color-mix(in srgb, var(--color-text) 78%, transparent);margin:0 0 20px;\">Pass all 9 questions to unlock your certificate.<\u002Fp>\n        <div style=\"display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px;\">\n          <input type=\"text\" class=\"input\" style=\"flex:1;min-width:220px;\" placeholder=\"Your full name\" value=\"{{ certName }}\" sc-camel-on-change=\"{{ onCertNameChange }}\" disabled=\"{{ certLockedVisible }}\">\n          <button type=\"button\" class=\"btn btn-primary\" disabled=\"{{ certBtnDisabled }}\" sc-camel-on-click=\"{{ onGenerateCert }}\">Generate Certificate<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ certLockedVisible }}\" hint-placeholder-val=\"{{ true }}\"><p style=\"color:color-mix(in srgb, var(--color-text) 70%, transparent);font-size:14px;\">Complete the knowledge check to unlock this.<\u002Fp><\u002Fsc-if>\n        <sc-if value=\"{{ certGenerated }}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"card elev-md\" style=\"text-align:center;padding:40px 36px;margin-top:16px;\">\n            <div style=\"font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700);\">US Wellness · Flu Shot Clinic<\u002Fdiv>\n            <div style=\"font-size:26px;font-weight:600;margin:10px 0 24px;\">CERTIFICATE OF COMPLETION<\u002Fdiv>\n            <div style=\"font-style:italic;font-size:26px;color:var(--color-text);border-bottom:2px solid var(--color-accent-2);display:inline-block;padding:0 20px 8px;margin-bottom:20px;\">{{ certData.name }}<\u002Fdiv>\n            <p style=\"max-width:480px;margin:0 auto 24px;color:color-mix(in srgb, var(--color-text) 78%, transparent);font-size:14px;\">has completed all required training modules for US Wellness flu shot clinic events, including cold-chain vaccine handling, consent screening, syringe assembly, intramuscular administration, and required documentation.<\u002Fp>\n            <div style=\"display:flex;justify-content:center;gap:30px;font-size:12px;color:color-mix(in srgb, var(--color-text) 70%, transparent);flex-wrap:wrap;\">\n              <span>DATE: {{ certData.date }}<\u002Fspan><span>SCORE: {{ certData.score }}<\u002Fspan><span>ID: {{ certData.id }}<\u002Fspan>\n            <\u002Fdiv>\n            <button type=\"button\" class=\"btn btn-secondary\" style=\"margin-top:20px;\" sc-camel-on-click=\"{{ onPrint }}\">Print / Save PDF<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n\n    <div style=\"padding:20px 24px 32px;border-top:1px solid var(--color-divider);display:flex;justify-content:space-between;gap:12px;max-width:760px;\">\n      <button type=\"button\" class=\"btn btn-secondary\" disabled=\"{{ prevDisabled }}\" sc-camel-on-click=\"{{ onPrev }}\">← Previous<\u002Fbutton>\n      <button type=\"button\" class=\"btn btn-primary\" disabled=\"{{ nextDisabled }}\" sc-camel-on-click=\"{{ onNext }}\">Next →<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst QUESTIONS = [\n  { q: \"How does flu vaccine arrive, and how far in advance of the clinic?\", options: [\"Ground shipping, about 2 weeks before\", \"UPS overnight, 3–5 days before\", \"Mailed together with dry supplies\"], correct: 1 },\n  { q: \"Where do the ice packs go when you receive your vaccine shipment?\", options: [\"In the refrigerator\", \"In the freezer\", \"Left in the cooler at room temperature\"], correct: 1 },\n  { q: \"The temperature card shows blue fill all the way to the 48-hour mark. What do you do?\", options: [\"Use the vaccine as normal\", \"Discard the vaccine without calling anyone\", \"Call US Wellness On-Call immediately\"], correct: 2 },\n  { q: \"What vaccine does US Wellness use for flu clinics?\", options: [\"A multi-dose vial requiring individual draws\", \"Flucelvax Quadrivalent Pre-Filled Syringe\", \"A nasal spray formulation\"], correct: 1 },\n  { q: \"Which needle size is correct for a man who weighs 150 lbs?\", options: [\"1-inch\", \"1½-inch\", \"No needle needed\"], correct: 0 },\n  { q: \"How long should a first-time flu shot recipient stay at or near the event afterward?\", options: [\"5 minutes\", \"15 minutes\", \"60 minutes\"], correct: 1 },\n  { q: \"How many participants can one manufacturer pre-filled syringe be used on?\", options: [\"One\", \"Two, if doses allow\", \"As many as needed until it's empty\"], correct: 0 },\n  { q: \"Where can you find a flu shot's lot number?\", options: [\"Only by calling US Wellness On-Call\", \"On the syringe label and the box it was pulled from\", \"It isn't tracked per dose\"], correct: 1 },\n  { q: \"Which copy of the Flu Consent + Contraindication Form does the participant keep?\", options: [\"White copy\", \"Yellow copy\", \"Neither — US Wellness keeps both\"], correct: 1 }\n];\n\nconst ORDER = ['overview','shipment','serum','checkin','consent','assembly','administering','injection','lotnumber','anaphylaxis','documentation','salesforce','shippingchart','returns','shippingchart2','support','quiz','certificate'];\nconst MODULES = [\n  {id:'shipment', label:'Supply Shipment & Storage'},\n  {id:'serum', label:'Flu Shot / Vaccine Overview'},\n  {id:'checkin', label:'Participant Check-In'},\n  {id:'consent', label:'Consent + Contraindication Form'},\n  {id:'assembly', label:'Flu Shot Assembly'},\n  {id:'administering', label:'Administering the Shot'},\n  {id:'injection', label:'Injection Site & Safety'},\n  {id:'lotnumber', label:'Verify and Record Your Lot Number'},\n  {id:'anaphylaxis', label:'Emergency Protocol: Anaphylactic Shock'},\n  {id:'documentation', label:'Required Documentation'},\n  {id:'salesforce', label:'Salesforce Data Entry'},\n  {id:'shippingchart', label:'US Wellness Flu Vaccine Storage'},\n  {id:'returns', label:'Returning Vaccine & Supplies'},\n  {id:'shippingchart2', label:'US Wellness Flu Shipping Chart'},\n  {id:'support', label:'Support & Emergency Contacts'}\n];\nconst WRAP = [\n  {id:'quiz', label:'✓ Knowledge Check'},\n  {id:'certificate', label:'🎓 Certificate'}\n];\n\nclass Component extends DCLogic {\n  state = {\n    activeId: 'overview',\n    qStatus: Array(9).fill('open'),\n    flashWrong: {},\n    certName: '',\n    certGenerated: false,\n    certData: null,\n    lightboxOpen: false,\n    lightboxOpen2: false,\n    lotLightboxOpen: false,\n    salesforceLightboxOpen: false,\n    youtubeUrl: '',\n    isMobile: typeof window !== 'undefined' && window.innerWidth < 860,\n    sidebarOpen: false\n  };\n\n  componentDidMount() {\n    this._onResize = () => this.setState({ isMobile: window.innerWidth < 860 });\n    window.addEventListener('resize', this._onResize);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('resize', this._onResize);\n  }\n\n  static extractYoutubeId(url) {\n    const m = (url || '').match(/(?:youtube\\.com\\/(?:watch\\?v=|embed\\/|shorts\\/)|youtu\\.be\\/)([\\w-]{6,})/);\n    return m ? m[1] : null;\n  }\n\n  handleOptionClick(qi, oi) {\n    if (this.state.qStatus[qi] === 'correct') return;\n    if (oi === QUESTIONS[qi].correct) {\n      this.setState(s => { const qStatus = [...s.qStatus]; qStatus[qi] = 'correct'; return { qStatus }; });\n    } else {\n      this.setState(s => ({ flashWrong: { ...s.flashWrong, [qi]: oi } }));\n      setTimeout(() => {\n        this.setState(s => { const fw = { ...s.flashWrong }; delete fw[qi]; return { flashWrong: fw }; });\n      }, 900);\n    }\n  }\n\n  generateCert() {\n    if (!this.state.certName.trim()) return;\n    const correctCount = this.state.qStatus.filter(s => s === 'correct').length;\n    this.setState({\n      certGenerated: true,\n      certData: {\n        name: this.state.certName.trim(),\n        date: new Date().toLocaleDateString('en-US', { year: 'numeric', month: '2-digit', day: '2-digit' }),\n        score: correctCount + '/9',\n        id: 'FLU-' + Math.floor(100000 + Math.random() * 900000)\n      }\n    });\n  }\n\n  goTo(id) {\n    this.setState(s => ({ activeId: id, sidebarOpen: s.isMobile ? false : s.sidebarOpen }));\n  }\n\n  renderVals() {\n    const activeId = this.state.activeId;\n    const isSection = {};\n    ORDER.forEach(id => { isSection[id] = id === activeId; });\n\n    const sidebarModules = MODULES.map((m, i) => {\n      const active = m.id === activeId;\n      return {\n        id: m.id,\n        num: String(i + 1).padStart(2, '0'),\n        label: m.label,\n        onClick: () => this.goTo(m.id),\n        style: {\n          padding: '7px 10px', borderRadius: 'var(--radius-md)', marginBottom: '4px', cursor: 'pointer',\n          background: active ? 'var(--color-accent-800)' : 'transparent',\n          color: active ? 'var(--color-bg)' : 'color-mix(in srgb, var(--color-bg) 82%, transparent)'\n        }\n      };\n    });\n    const sidebarWrap = WRAP.map(w => {\n      const active = w.id === activeId;\n      return {\n        id: w.id, label: w.label, onClick: () => this.goTo(w.id),\n        style: {\n          padding: '7px 10px', borderRadius: 'var(--radius-md)', marginBottom: '4px', cursor: 'pointer',\n          background: active ? 'var(--color-accent-800)' : 'transparent',\n          color: active ? 'var(--color-accent-300)' : 'var(--color-accent-300)'\n        }\n      };\n    });\n\n    const idx = ORDER.indexOf(activeId);\n    const onPrev = () => { if (idx > 0) this.goTo(ORDER[idx - 1]); };\n    const onNext = () => { if (idx < ORDER.length - 1) this.goTo(ORDER[idx + 1]); };\n\n    const correctCount = this.state.qStatus.filter(s => s === 'correct').length;\n    const allCorrect = correctCount === 9;\n\n    const baseStyle = { background: 'var(--color-surface)', border: '1.5px solid var(--color-divider)', borderRadius: 'var(--radius-md)', padding: '11px 15px', marginBottom: '8px', width: '100%', textAlign: 'left', font: 'inherit', fontSize: '14px', color: 'var(--color-text)', cursor: 'pointer', display: 'block' };\n    const correctStyle = { ...baseStyle, background: 'var(--color-accent-100)', border: '1.5px solid var(--color-accent)', color: 'var(--color-accent-800)', fontWeight: 600, cursor: 'default' };\n    const wrongStyle = { ...baseStyle, background: 'var(--color-accent-2-100)', border: '1.5px solid var(--color-accent-2)', color: 'var(--color-accent-2-800)' };\n\n    const questions = QUESTIONS.map((q, qi) => {\n      const status = this.state.qStatus[qi];\n      return {\n        qNumber: qi + 1,\n        qText: q.q,\n        options: q.options.map((opt, oi) => {\n          let style = baseStyle;\n          if (status === 'correct' && oi === q.correct) style = correctStyle;\n          else if (this.state.flashWrong[qi] === oi) style = wrongStyle;\n          return { label: opt, style, disabled: status === 'correct', onClick: () => this.handleOptionClick(qi, oi) };\n        })\n      };\n    });\n\n    const isMobile = this.state.isMobile;\n    const sidebarVisible = !isMobile || this.state.sidebarOpen;\n    const sidebarStyle = isMobile\n      ? { width: '260px', maxWidth: '80vw', background: 'var(--color-text)', color: 'var(--color-bg)', padding: '26px 20px', position: 'fixed', top: 0, left: 0, height: '100vh', overflowY: 'auto', zIndex: 300 }\n      : { width: '270px', flex: 'none', background: 'var(--color-text)', color: 'var(--color-bg)', padding: '26px 20px', position: 'sticky', top: 0, height: '100vh', overflowY: 'auto' };\n\n    return {\n      isSection, sidebarModules, sidebarWrap,\n      onGoOverview: () => this.goTo('overview'),\n      overviewNavStyle: {\n        padding: '7px 10px', borderRadius: 'var(--radius-md)', marginBottom: '14px', cursor: 'pointer',\n        background: activeId === 'overview' ? 'var(--color-accent-800)' : 'transparent',\n        color: activeId === 'overview' ? 'var(--color-bg)' : 'color-mix(in srgb, var(--color-bg) 82%, transparent)'\n      },\n      isMobile, sidebarVisible, sidebarStyle,\n      onToggleSidebar: () => this.setState(s => ({ sidebarOpen: !s.sidebarOpen })),\n      onCloseSidebar: () => this.setState({ sidebarOpen: false }),\n      mainPaneStyle: isMobile ? 'padding-top:52px' : '',\n      contentPadding: isMobile ? '24px 20px' : '44px 56px',\n      onPrev, onNext, prevDisabled: idx <= 0, nextDisabled: idx >= ORDER.length - 1,\n      questions, correctCount, totalQuestions: 9,\n      progressPct: Math.round(correctCount / 9 * 100) + '%',\n      scoreBannerText: allCorrect ? 'All 9 correct — knowledge check complete.' : ('Keep going — ' + (9 - correctCount) + ' question(s) remaining.'),\n      scoreBannerStyle: allCorrect\n        ? { background: 'var(--color-accent-100)', color: 'var(--color-accent-800)', padding: '16px 18px', borderRadius: 'var(--radius-md)', fontSize: '14.5px', fontWeight: 600 }\n        : { background: 'var(--color-surface)', color: 'var(--color-text)', padding: '16px 18px', borderRadius: 'var(--radius-md)', fontSize: '14.5px', fontWeight: 600, opacity: 0.85 },\n      certName: this.state.certName,\n      onCertNameChange: (e) => this.setState({ certName: e.target.value }),\n      certBtnDisabled: !allCorrect || !this.state.certName.trim(),\n      certLockedVisible: !allCorrect,\n      onGenerateCert: () => this.generateCert(),\n      certGenerated: this.state.certGenerated,\n      certData: this.state.certData || { name: '', date: '', score: '', id: '' },\n      onPrint: () => window.print(),\n      lightboxOpen: this.state.lightboxOpen,\n      consentPhotoStyle: this.state.lightboxOpen\n        ? { position: 'fixed', top: '50%', left: '50%', transform: 'translate(-50%,-50%)', width: '85vw', maxWidth: '900px', height: '85vh', zIndex: 1000, background: '#000' }\n        : { width: '100%', height: '220px' },\n      enlargeBtnStyle: { position: 'absolute', bottom: '8px', right: '8px', background: 'rgba(255,255,255,.92)', border: 'none', borderRadius: 'var(--radius-md)', padding: '5px 10px', font: 'inherit', fontSize: '12px', cursor: 'pointer', zIndex: 2 },\n      lotLightboxOpen: this.state.lotLightboxOpen,\n      lotPhotoStyle: this.state.lotLightboxOpen\n        ? { position: 'fixed', top: '50%', left: '50%', transform: 'translate(-50%,-50%)', width: '85vw', maxWidth: '900px', height: '85vh', zIndex: 1000, background: '#000' }\n        : { width: '100%', height: '240px' },\n      onOpenLotLightbox: () => this.setState({ lotLightboxOpen: true }),\n      onCloseLotLightbox: () => this.setState({ lotLightboxOpen: false }),\n      onOpenLightbox: () => this.setState({ lightboxOpen: true }),\n      onCloseLightbox: () => this.setState({ lightboxOpen: false }),\n      lightboxOpen2: this.state.lightboxOpen2,\n      consentPhotoStyle2: this.state.lightboxOpen2\n        ? { position: 'fixed', top: '50%', left: '50%', transform: 'translate(-50%,-50%)', width: '85vw', maxWidth: '900px', height: '85vh', zIndex: 1000, background: '#000', imageRendering: 'auto' }\n        : { width: '100%', height: '220px', imageRendering: 'auto', backgroundColor: 'var(--color-surface)' },\n      enlargeBtnStyle2: { position: 'absolute', bottom: '8px', right: '8px', background: 'rgba(255,255,255,.92)', border: 'none', borderRadius: 'var(--radius-md)', padding: '5px 10px', font: 'inherit', fontSize: '12px', cursor: 'pointer', zIndex: 2 },\n      onOpenLightbox2: () => this.setState({ lightboxOpen2: true }),\n      onCloseLightbox2: () => this.setState({ lightboxOpen2: false }),\n      salesforceLightboxOpen: this.state.salesforceLightboxOpen,\n      salesforcePhotoStyle: this.state.salesforceLightboxOpen\n        ? { position: 'fixed', top: '50%', left: '50%', transform: 'translate(-50%,-50%)', width: '85vw', maxWidth: '900px', height: '85vh', zIndex: 1000, background: '#000' }\n        : { width: '100%', height: '220px' },\n      salesforceEnlargeBtnStyle: { position: 'absolute', bottom: '8px', right: '8px', background: 'rgba(255,255,255,.92)', border: 'none', borderRadius: 'var(--radius-md)', padding: '5px 10px', font: 'inherit', fontSize: '12px', cursor: 'pointer', zIndex: 2 },\n      onOpenSalesforceLightbox: () => this.setState({ salesforceLightboxOpen: true }),\n      onCloseSalesforceLightbox: () => this.setState({ salesforceLightboxOpen: false }),\n      youtubeUrl: this.state.youtubeUrl,\n      onYoutubeUrlChange: (e) => this.setState({ youtubeUrl: e.target.value }),\n      youtubeEmbedId: Component.extractYoutubeId(this.state.youtubeUrl),\n      youtubeEmbedSrc: 'https://www.youtube-nocookie.com/embed/' + (Component.extractYoutubeId(this.state.youtubeUrl) || '') + '?start=140&end=210'\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
