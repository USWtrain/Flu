  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

F, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"984505ea-c861-47b8-a135-bedfdebfb0f9\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"42f6b899-d5d2-46b3-8b64-d1625e5f5b1d\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"e7d5e3eb-9f90-482f-acf0-be4fcde1af99\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"f8ecd6cd-67bf-4c33-8d1b-d860edc8f6c9\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"6a870c44-a90a-4b50-b0d9-178f460a8bc5\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"4af9ffd6-2e6f-4083-ab56-79d6c560aed6\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"984505ea-c861-47b8-a135-bedfdebfb0f9\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #0088b0;\n  --color-accent-2: #d6006c;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #e9f8ff;\n  --color-accent-200: #cbeeff;\n  --color-accent-300: #99e0ff;\n  --color-accent-400: #62c5ee;\n  --color-accent-500: #38a6cf;\n  --color-accent-600: #1186ac;\n  --color-accent-700: #006786;\n  --color-accent-800: #004961;\n  --color-accent-900: #0a303e;\n\n  --color-accent-2-100: #fff1f4;\n  --color-accent-2-200: #ffdee6;\n  --color-accent-2-300: #ffc0d0;\n  --color-accent-2-400: #ff90b1;\n  --color-accent-2-500: #ff458e;\n  --color-accent-2-600: #d82071;\n  --color-accent-2-700: #aa0b56;\n  --color-accent-2-800: #790e3d;\n  --color-accent-2-900: #4b1528;\n\n  /* The third process ink — review round 3: the deck's print treatments\n     (the CMYK separation and the misregistered plate numerals below) need\n     the full four-color set. Cyan and magenta are the system's own accents;\n     this yellow completes them, muted to the same press-ink register. A\n     print treatment color, not an interface accent — body copy and chrome\n     never take it. */\n  --color-process-yellow: #edbb00;\n\n  --font-heading: \"Source Serif 4\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Source Serif 4\", system-ui, sans-serif;\n\n  --space-1: 5.0px;\n  --space-2: 10.0px;\n  --space-3: 15.0px;\n  --space-4: 20.0px;\n  --space-6: 30.0px;\n  --space-8: 40.0px;\n\n  --radius-sm: 1px;\n  --radius-md: 2px;\n  --radius-lg: 4px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.halftone{position:relative;filter:grayscale(0.35) contrast(1.15);overflow:hidden}\n.halftone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The four-color separation treatment (review round 3) — a photograph\n   printed as its misregistered process plates, after the Catalogue Three\n   grammar. Markup: a figure.cmyk holding five copies of the image — the\n   first is the layout sizer (hidden), then one per plate, each tagged\n   .sep-c/.sep-m/.sep-y/.sep-k. The plates are extracted live by the SVG\n   feColorMatrix filters in print-plates.js, the system's own defs —\n   inlined in the compiled bundle every template page loads, and a\n   page that links styles.css directly adds\n   <script src=\"print-plates.js\"><\u002Fscript> itself (the defs must be in\n   the document: a data-URI filter reference would not survive Chromium,\n   and external-file references are unreliable across engines) — nudged\n   a few pixels out of register, and multiplied\n   onto the paper ground; the halftone dot screens the recombined print.\n   The plate offsets live with the deck's projection-scale CSS, since\n   misregistration is sized to the output. */\n.cmyk{position:relative;overflow:hidden;background:var(--color-bg)}\n.cmyk img:first-child{opacity:0} /* layout sizer AND the alt-bearing image — opacity\n  keeps it in the accessibility tree (visibility:hidden would drop the figure's only\n  description); fully transparent, it adds nothing to the multiply backdrop */\n.cmyk img+img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}\n.cmyk .sep-c{filter:url(#sep-c)}\n.cmyk .sep-m{filter:url(#sep-m)}\n.cmyk .sep-y{filter:url(#sep-y)}\n.cmyk .sep-k{filter:url(#sep-k)}\n.cmyk::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The one-image separation (review round 9, promoted from the deck in the\n   landing divergence) — the same four plates as ONE compound filter,\n   #sep-all in print-plates.js, for a single swappable image: a .print\n   wrapper inside the figure holds one <image-slot>, and the filter\n   extracts, offsets and multiplies the plates live from whatever the slot\n   shows. Markup: figure.cmyk > .print > image-slot (the page sizes the\n   .print — aspect-ratio, or absolute fill for bleeds). Hover resolves\n   the print into the photograph — the pressman checking registration on\n   the light table — so the source shows crisp and any swap chrome stays\n   legible; only the reduced-motion fallback below still lifts as a\n   single cut (a url() filter cannot CSS-transition; the press driver\n   animates the defs instead). */\n.cmyk .print{position:relative;width:100%;filter:url(#sep-all)}\n/* no hover end-state swap: the press driver (print-plates.js) eases the\n   plates into register while purifying their inks to the pure-process\n   separation on the same curve, so the converged four-plate merge IS\n   the photograph (their multiply equals SourceGraphic by construction)\n   — no cut anywhere on the animated path */\n@media (prefers-reduced-motion: reduce), (hover: none), (pointer: coarse) {\n  .cmyk .print:hover{filter:none} /* without the driver (it stands down on\n    exactly these conditions), hover stays the old single cut to the\n    crisp source */\n}\n.cmyk .print image-slot{width:100%;height:100%;display:block}\n\n/* The plate numeral (review rounds 3-4) — display figures set as\n   misregistered process plates, the catalog's cover grammar. Review\n   round 4 (Barron): THREE plates — C, M, Y only, no black plate — so the\n   dark core comes entirely from the C×M×Y multiply overlap (the inks\n   product to exact black), with the fringes the registration drift; and\n   the spread pulled in by half (less jumbled: one figure with plate\n   fringes rather than figures sliding apart). Markup: a .cmyk-num holding\n   a .paper span (the white of the sheet: the glyph's union, built from\n   offset text-shadow copies) and three .plate spans. The construction\n   carries its own ground (--cmyk-num-ground, defaulting to paper) painted\n   on its padding box, so the multiply plates always have their backdrop\n   even inside an isolated stacking context (entrance animations); the\n   padding bleeds wider than any plate offset and the negative margin\n   hands the layout box back. Offsets are em-scaled to the glyph. The\n   .paper span carries the text once for assistive tech; the .plate spans\n   are aria-hidden repeats. */\n.cmyk-num{--cmyk-num-ground:var(--color-bg);\n  position:relative;width:fit-content;line-height:0.9;\n  font-feature-settings:\"pnum\" 1;\n  background:var(--cmyk-num-ground);padding:0.12em;margin:-0.12em}\n.cmyk-num .paper{color:var(--color-bg); /* the white of the sheet — always paper,\n  whatever the ground: the plates read as printed on paper even when the\n  surrounding page is ink */\n  text-shadow:0.036em 0.025em 0 var(--color-bg),-0.031em -0.023em 0 var(--color-bg)}\n.cmyk-num .plate{position:absolute;inset:0.12em;mix-blend-mode:multiply;\n  text-box:trim-both cap alphabetic /* the host trims to its cap box; each\n  absolute plate must trim its own line the same way, or its glyphs sit a\n  half-leading below the paper union */}\n.cmyk-num .plate-c{color:var(--color-accent)}\n\n/* The plate headline (divergence round 3, Barron: \"use both\" — the\n   photograph's plates AND the cover grammar's text plates, on the same\n   page). The same three-plate construction as .cmyk-num — paper span\n   carrying the real text, C/M/Y plate repeats, dark core from the\n   multiply overlap — at HALF the numeral's round-4 offsets: the serif's\n   display hairlines are thinner than the numeral strokes the spread was\n   measured on, and the full offsets swallow them whole (probed at the\n   hero's 80px — the fringes read as an anaglyph poster, not a breath\n   out of register) — recut for display\n   headlines that sit in running text blocks on the page's own paper:\n   no ground painting and no padding bleed (the numeral's ground exists\n   for isolated stacking contexts; a headline on the page multiplies\n   straight onto the sheet), no width:fit-content and no line-height\n   override (the host display class owns its metrics — apply this to\n   each .line, which is position:relative for its plates), and the\n   plates are inert to the hand (pointer-events/user-select none, so a\n   triple-click selects the headline once, not four times). Plates take\n   the same pointer lean as .cmyk-num. */\n.cmyk-head{position:relative}\n.cmyk-head .paper{color:var(--color-bg);\n  text-shadow:0.027em 0.0185em 0 var(--color-bg),-0.0245em -0.0175em 0 var(--color-bg)\n  /* the union's copies sit at the construction's halved plate offsets\n     PLUS the full lean (0.018+0.009 / 0.0125+0.006, and mirrored), so\n     the union still backs the plates at viewport-edge lean — invisible\n     on the page's own paper, load-bearing on any other ground */}\n.cmyk-head .plate{position:absolute;inset:0;mix-blend-mode:multiply;\n  pointer-events:none;user-select:none;\n  text-box:trim-both cap alphabetic /* match the host's trim, or the\n  plates sit a half-leading below the paper union */}\n.cmyk-head .plate-c{color:var(--color-accent)}\n.cmyk-head .plate-m{color:var(--color-accent-2);\n  translate:calc(0.018em + 0.009em*var(--press-nx, 0)) calc(0.0125em + 0.006em*var(--press-ny, 0))}\n.cmyk-head .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.0155em + 0.009em*var(--press-nx, 0)) calc(-0.0115em + 0.006em*var(--press-ny, 0))}\n.cmyk-num .plate-m{color:var(--color-accent-2);\n  translate:calc(0.036em + 0.018em*var(--press-nx, 0)) calc(0.025em + 0.0125em*var(--press-ny, 0))}\n.cmyk-num .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.031em + 0.018em*var(--press-nx, 0)) calc(-0.023em + 0.0125em*var(--press-ny, 0))}\n/* --press-nx/--press-ny: the pointer lean as a bare -1..1 factor,\n   published on :root by the press driver (print-plates.js) and zero\n   whenever the driver stands down. Each construction scales the lean to\n   its own spread (half of it, here as everywhere) so the moving plates\n   drift a breath toward the cursor and the C plate holds. */\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input::placeholder { color: color-mix(in srgb, var(--color-text) 65%, transparent); opacity: 1; }\n  /* explicit, measured: the browser default gray misses the 4.5:1 small-text bar on\n     the surface fill; 65% ink measures 4.8:1 there, still a step quieter than typed\n     text (opacity:1 overrides Firefox's default placeholder fade) */\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"48e74b8d-5b39-460d-8624-bfb426f1525f\"><\u002Fscript>\n<script src=\"4fd6ec2c-10e1-4ff9-bc18-4cf58c934720\"><\u002Fscript>\n<style>\nbody{margin:0;text-wrap:pretty}\na{color:var(--color-accent);text-underline-offset:3px}\na:hover{color:var(--color-accent-700)}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"display:flex;min-height:100vh;position:relative;\">\n\n  <!-- Mobile top bar -->\n  <sc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;top:0;left:0;right:0;height:52px;background:var(--color-text);color:var(--color-bg);display:flex;align-items:center;gap:12px;padding:0 16px;z-index:200;\">\n      <button type=\"button\" sc-camel-on-click=\"{{ onToggleSidebar }}\" style=\"background:none;border:1px solid color-mix(in srgb, var(--color-bg) 30%, transparent);color:var(--color-bg);border-radius:var(--radius-md);padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;\">☰ Modules<\u002Fbutton>\n      <span style=\"font-family:var(--font-heading);font-weight:600;font-size:14px;\">US Wellness Training<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- Sidebar -->\n  <sc-if value=\"{{ sidebarVisible }}\" hint-placeholder-val=\"{{ true }}\">\n    <sc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:299;\" sc-camel-on-click=\"{{ onCloseSidebar }}\"><\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"{{ sidebarStyle }}\">\n    <div style=\"font-family:var(--font-heading);font-weight:600;font-size:16px;margin-bottom:4px;\">US Wellness<\u002Fdiv>\n    <div style=\"font-size:11px;color:color-mix(in srgb, var(--color-bg) 65%, transparent);margin-bottom:22px;\">Flu Shot Clinic Training<\u002Fdiv>\n\n    <div style=\"{{ overviewNavStyle }}\" sc-camel-on-click=\"{{ onGoOverview }}\">\n      <div style=\"font-size:12px;line-height:1.3;\">Overview<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb, var(--color-bg) 55%, transparent);margin-bottom:8px;\">Modules<\u002Fdiv>\n    <sc-for list=\"{{ sidebarModules }}\" as=\"m\" hint-placeholder-count=\"15\">\n      <div style=\"{{ m.style }}\" sc-camel-on-click=\"{{ m.onClick }}\">\n        <div style=\"font-size:9px;font-family:var(--font-heading);opacity:.6;margin-bottom:1px;\">{{ m.num }}<\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.3;\">{{ m.label }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n\n    <div style=\"font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb, var(--color-bg) 55%, transparent);margin:18px 0 8px;\">Wrap-Up<\u002Fdiv>\n    <sc-for list=\"{{ sidebarWrap }}\" as=\"w\" hint-placeholder-count=\"2\">\n      <div style=\"{{ w.style }}\" sc-camel-on-click=\"{{ w.onClick }}\">\n        <div style=\"font-size:12px;line-height:1.3;\">{{ w.label }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n\n    <div style=\"margin-top:24px;padding-top:16px;border-top:1px solid color-mix(in srgb, var(--color-bg) 18%, transparent);font-size:11px;color:color-mix(in srgb, var(--color-bg) 70%, transparent);\">On-call: 866-881-7607<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- Main pane -->\n  <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;{{ mainPaneStyle }}\">\n    <div style=\"flex:1;padding:{{ contentPadding }};max-width:760px;\">\n\n      <sc-if value=\"{{ isSection.overview }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin-bottom:10px;\">FLU-00 · START HERE<\u002Fspan>\n        <h1 style=\"font-size:32px;margin:0 0 18px;\">Overview<\u002Fh1>\n        <p style=\"font-size:17px;max-width:56ch;\">This training covers everything US Wellness field staff need to run a flu shot clinic — from the moment your vaccine shipment arrives to the moment it ships back. Read it before your first event.<\u002Fp>\n        <p>US Wellness runs onsite <b>seasonal flu vaccination clinics<\u002Fb> for client organizations nationwide. Each clinic delivers a preservative-free, pre-filled dose of the <b>Flucelvax Quadrivalent<\u002Fb> vaccine to every participant, along with proper consent screening, documentation, and cold-chain handling of the vaccine itself.<\u002Fp>\n        <p>Unlike a screening event, there's no lab result to interpret — but every participant receives an injection which cannot be undone once given. Getting the shipment, the consent form, the needle size, and the paperwork right isn't just good practice; it's what keeps every participant safe and every record accurate.<\u002Fp>\n\n        <h4 style=\"margin:26px 0 10px;\">What a clinic covers<\u002Fh4>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 32px;\">\n          <div style=\"padding:10px 0;border-bottom:1px dashed var(--color-divider);\">Cold-chain receipt &amp; storage of flu vaccine<\u002Fdiv>\n          <div style=\"padding:10px 0;border-bottom:1px dashed var(--color-divider);\">Participant check-in &amp; appointment lookup<\u002Fdiv>\n          <div style=\"padding:10px 0;border-bottom:1px dashed var(--color-divider);\">Consent + contraindication screening<\u002Fdiv>\n          <div style=\"padding:10px 0;border-bottom:1px dashed var(--color-divider);\">Pre-filled syringe assembly (needle sizing)<\u002Fdiv>\n          <div style=\"padding:10px 0;border-bottom:1px dashed var(--color-divider);\">Intramuscular administration of the vaccine<\u002Fdiv>\n          <div style=\"padding:10px 0;border-bottom:1px dashed var(--color-divider);\">Paper + Salesforce documentation of every dose<\u002Fdiv>\n          <div style=\"padding:10px 0;border-bottom:1px dashed var(--color-divider);\">Return shipment of unused vaccine &amp; supplies<\u002Fdiv>\n        <\u002Fdiv>\n\n        <h4 style=\"margin:26px 0 10px;\">Key numbers<\u002Fh4>\n        <div style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px 30px;padding:4px 0 16px;\">\n          <div><span style=\"font-size:24px;font-weight:600;color:var(--color-accent-700);\">1<\u002Fspan><div style=\"font-size:12px;color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Pre-filled syringe per participant<\u002Fdiv><\u002Fdiv>\n          <div><span style=\"font-size:24px;font-weight:600;color:var(--color-accent-700);\">3–5 days<\u002Fspan><div style=\"font-size:12px;color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Vaccine transit window<\u002Fdiv><\u002Fdiv>\n          <div><span style=\"font-size:24px;font-weight:600;color:var(--color-accent-700);\">15 min<\u002Fspan><div style=\"font-size:12px;color:color-mix(in srgb, var(--color-text) 70%, transparent);\">First-timer observation<\u002Fdiv><\u002Fdiv>\n          <div><span style=\"font-size:24px;font-weight:600;color:var(--color-accent-700);\">2<\u002Fspan><div style=\"font-size:12px;color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Needle sizes stocked<\u002Fdiv><\u002Fdiv>\n          <div><span style=\"font-size:24px;font-weight:600;color:var(--color-accent-700);\">48 hr<\u002Fspan><div style=\"font-size:12px;color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Temp card threshold<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"card\" style=\"margin:16px 0;\"><span class=\"card-kicker\">Keep Handy<\u002Fspan><p class=\"card-body\">US Wellness On-Call — <b>866-881-7607<\u002Fb><\u002Fp><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSection.shipment }}\" hint-placeholder-val=\"{{ true }}\">\n        <span style=\"display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-700);margin-bottom:10px;\">FLU-01 · DO THIS FIRST<\u002Fspan>\n        <h1 style=\"font-size:28px;margin:0 0 18px;\">Supply Shipment &amp; Storage<\u002Fh1>\n        <div style=\"display:flex;gap:36px;flex-wrap:wrap;align-items:flex-start;\">\n          <div style=\"flex:2;min-width:300px;\">\n            <p>Your flu shipment arrives in <b>two separate deliveries<\u002Fb>. Ancillary (dry) supplies arrive approximately one week before your clinic. Flu vaccine arrives via <b>UPS overnight, 3–5 days prior<\u002Fb> to your event.<\u002Fp>\n            <p><b>Immediately upon receiving your vaccine shipment:<\u002Fb><\u002Fp>\n            <ol>\n              <li>Review the pack list to confirm all supplies listed are included.<\u002Fli>\n              <li>Remove the cooler containing flu vaccine and store it properly:\n                <ul>\n                  <li>Ice packs go in a <b>freezer<\u002Fb> — never a refrigerator.<\u002Fli>\n                  <li>Vaccine must be <b>refrigerated<\u002Fb>. You can place the whole cooler in the fridge, or just the boxes of vaccine.<\u002Fli>\n                <\u002Ful>\n              <\u002Fli>\n            <\u002Fol>\n            <div class=\"card\" style=\"margin:16px 0;\"><span class=\"card-kicker\">Note<\u002Fspan><p class=\"card-body\">Check the temperature card inside the cooler to confirm the vaccine stayed within range during shipment.<\u002Fp><\u002Fdiv>\n            <div class=\"card\" style=\"margin:16px 0;background:var(--color-accent-2-100);\"><span class=\"card-kicker\" style=\"color:var(--color-accent-2-700);\">Important<\u002Fspan><p class=\"card-body\" style=\"color:var(--color-accent-2-800);opacity:1;\"><b>If the temperature bar is filled blue all the way to the 48-hour mark<\u002Fb>, call US Wellness On-Call at <b>866-881-7607<\u002Fb> immediately.<\u002Fp><\u002Fdiv>\n            <p><b>On the day of your clinic:<\u002Fb> reassemble your cooler. Vaccine goes back in with the ice packs before shipping supplies return.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"flex:1.3;min-width:320px;\">\n            <div style=\"border-radius:var(--radius-md);overflow:hidden;\">\n              <image-slot id=\"shipment-photo\" shape=\"rect\" fit=\"contain\" style=\"width:100%;height:320px;\" placeholder=\"Drop a photo of the vaccine cooler / temp card\" src=\"0dd5fb84-31b3-4076-82b3-a33c32a7c5c2\"><\u002Fimage-slot>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSection.serum }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin-bottom:10px;\">FLU-02 · REFERENCE<\u002Fspan>\n        <h1 style=\"font-size:28px;margin:0 0 18px;\">Flu Shot / Vaccine Overview<\u002Fh1>\n        <p>US Wellness uses the <b>Flucelvax Quadrivalent Pre-Filled Syringe<\u002Fb> for all flu shot clinics. The vaccine is <b>preservative free<\u002Fb>.<\u002Fp>\n        <p>Because doses arrive pre-filled, there's no drawing required during clinic — you'll only need to attach the appropriately sized needle to complete assembly of each shot.<\u002Fp>\n        <div style=\"border-radius:var(--radius-md);overflow:hidden;margin:16px 0;max-width:400px;\">\n          <image-slot id=\"shipment-photo-2\" shape=\"rect\" fit=\"contain\" style=\"width:100%;height:220px;\" placeholder=\"Drop a photo of the pre-filled syringe\" src=\"69a1efba-415f-41ce-9ee0-1e7a56051e93\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"margin:16px 0;\"><span class=\"card-kicker\">Tip<\u002Fspan><p class=\"card-body\">One pre-filled syringe = one dose. There's nothing to measure, draw, or split.<\u002Fp><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSection.checkin }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin-bottom:10px;\">FLU-03 · FRONT DESK<\u002Fspan>\n        <h1 style=\"font-size:28px;margin:0 0 18px;\">Participant Check-In<\u002Fh1>\n        <ul>\n          <li>Greet the participant and ask whether they have an appointment.<\u002Fli>\n          <li>Locate their appointment (if one exists), or search/create their individual record in the tablet via Salesforce.<\u002Fli>\n          <li>For paper events only, not tablet events: ask the participant to complete the paper <b>Flu Consent Form<\u002Fb>. Every participant should complete one. For tablet events, this happens on the tablet itself, or ahead of time when the participant books their appointment.<\u002Fli>\n        <\u002Ful>\n        <div class=\"card\" style=\"margin:16px 0;\"><span class=\"card-kicker\">Note<\u002Fspan><p class=\"card-body\">For events with dedicated Registration/Admin staff, that role leads all aspects of check-in listed above.<\u002Fp><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSection.consent }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-700);margin-bottom:10px;\">FLU-04 · REQUIRED<\u002Fspan>\n        <h1 style=\"font-size:28px;margin:0 0 18px;\">Flu Consent + Contraindication Form<\u002Fh1>\n        <p>Every participant completes the <b>US Wellness Consent Form<\u002Fb> before receiving a shot — on paper at paper events, or on the tablet (either at check-in or ahead of time when the participant books their appointment) at tablet events. It screens for prior adverse reactions (flu vaccine, pneumonia vaccine, egg/chicken/feather allergy, mercury/thimerosal, latex), Guillain-Barré history, active neurological or bleeding disorders, pregnancy, and same-day illness.<\u002Fp>\n        <div class=\"card\" style=\"margin:16px 0;background:var(--color-accent-2-100);\"><span class=\"card-kicker\" style=\"color:var(--color-accent-2-700);\">Important<\u002Fspan><p class=\"card-body\" style=\"color:var(--color-accent-2-800);opacity:1;\">If a participant answers <b>Yes<\u002Fb> to being moderately or severely ill today, or to any of the listed contraindication questions, we recommend they <b>not<\u002Fb> receive the vaccine today. It is up to the nurse's discretion whether to administer a flu shot to a pregnant individual.<\u002Fp><\u002Fdiv>\n        <p>A section at the bottom of the form is completed by the <b>US Wellness Flu Shot Administrator<\u002Fb> only: injection date, site of injection, vaccine administrator signature, and lot number.<\u002Fp>\n        <sc-raw-table class=\"table\">\n          <sc-raw-tr><sc-raw-th>Completed by participant<\u002Fsc-raw-th><sc-raw-th>Completed by administrator<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Name, address, DOB, contact info, allergy &amp; contraindication questions, pregnancy status, signature<\u002Fsc-raw-td><sc-raw-td>Injection date, site of injection (right/left arm), vaccine administrator signature, lot number<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-table>\n        <sc-if value=\"{{ lightboxOpen2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;\" sc-camel-on-click=\"{{ onCloseLightbox2 }}\"><\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;gap:16px;flex-wrap:wrap;margin:16px 0;\">\n          <div style=\"border-radius:var(--radius-md);overflow:hidden;flex:1;min-width:160px;max-width:260px;position:relative;\">\n            <image-slot id=\"consent-photo-2\" shape=\"rect\" fit=\"contain\" style=\"{{ consentPhotoStyle2 }}\" placeholder=\"Drop a second photo\" src=\"8f565b3f-6a4c-4f7e-8a82-a62694e4a8e5\"><\u002Fimage-slot>\n            <button type=\"button\" sc-camel-on-click=\"{{ onOpenLightbox2 }}\" style=\"{{ enlargeBtnStyle2 }}\">⤢ Enlarge<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ lightboxOpen2 }}\" hint-placeholder-val=\"{{ false }}\">\n          <button type=\"button\" sc-camel-on-click=\"{{ onCloseLightbox2 }}\" style=\"position:fixed;top:24px;right:32px;z-index:1001;background:#fff;border:none;border-radius:var(--radius-md);padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;\">Close ✕<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSection.assembly }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-700);margin-bottom:10px;\">FLU-05 · TIME-CRITICAL<\u002Fspan>\n        <h1 style=\"font-size:28px;margin:0 0 18px;\">Flu Shot Assembly<\u002Fh1>\n        <ol>\n          <li>Check the expiration date on the manufacturer syringe.<\u002Fli>\n          <li>Gently swirl the syringe to get the vaccine moving.<\u002Fli>\n          <li>Choose the appropriate needle size (see chart below). You're gauging <i>relative<\u002Fi> weight — there's no scale, and participants don't need to disclose or be weighed.<\u002Fli>\n          <li>Attach the needle. Twist needle and syringe together, then verify it's securely attached. Don't remove the needle cap until it's time to administer.<\u002Fli>\n          <li>Remove the cap of the syringe.<\u002Fli>\n        <\u002Fol>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0;\">\n          <div class=\"card\"><span class=\"card-title\" style=\"color:var(--color-accent-700);\">1\"<\u002Fspan><p class=\"card-body\">Men 130–260 lbs, and women up to 200 lbs.<\u002Fp><\u002Fdiv>\n          <div class=\"card\"><span class=\"card-title\" style=\"color:var(--color-accent-700);\">1½\"<\u002Fspan><p class=\"card-body\">Women over 200 lbs (90 kg), and men over 260 lbs.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:13.5px;color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Your shipment will primarily contain 1-inch needles, with a small quantity of 1½-inch included.<\u002Fp>\n        <div class=\"card\" style=\"margin:16px 0;background:var(--color-accent-2-100);\"><span class=\"card-kicker\" style=\"color:var(--color-accent-2-700);\">Important<\u002Fspan><p class=\"card-body\" style=\"color:var(--color-accent-2-800);opacity:1;\"><b>Do NOT pre-assemble shots with needles.<\u002Fb> A needle is attached to a syringe only at the moment it's used with that specific participant.<\u002Fp><\u002Fdiv>\n        <div class=\"card\" style=\"margin:16px 0;\">\n          <span class=\"card-kicker\">Video<\u002Fspan>\n          <a href=\"https://www.youtube.com/watch?v=b22fcpRtMiE\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-block;font-size:14px;font-weight:600;\">▶ Watch Needle Assembly - minute mark 2:20-2:30<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSection.administering }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-700);margin-bottom:10px;\">FLU-06 · MOST IMPORTANT<\u002Fspan>\n        <h1 style=\"font-size:28px;margin:0 0 18px;\">Administering the Shot<\u002Fh1>\n        <ol>\n          <li>Verify the participant's first and last name. Confirm their contraindication responses are recorded and none are present — if any are, do not proceed.<\u002Fli>\n          <li>Ask if this is their first flu shot.\n            <ul>\n              <li>If <b>no<\u002Fb>, briefly assess their prior knowledge and experience.<\u002Fli>\n              <li>If <b>yes<\u002Fb>, let them know to pay attention to how they feel afterward. Allergic reactions are rare, but first-timers should stay at the event — or near people — for at least <b>15 minutes<\u002Fb>.<\u002Fli>\n            <\u002Ful>\n          <\u002Fli>\n          <li>Verbally disclose potential side effects:\n            <ul>\n              <li>Soreness or swelling at the injection site<\u002Fli>\n              <li>Mild flu-like symptoms or body aches<\u002Fli>\n              <li>Allergic reaction — hives, swelling around mouth/eyes, itching, trouble breathing<\u002Fli>\n            <\u002Ful>\n          <\u002Fli>\n          <li>Tell the participant to seek immediate medical attention if an allergic reaction occurs, and remind them <b>they cannot get the flu from the flu shot<\u002Fb>.<\u002Fli>\n          <li>Ask if they have questions, be ready to answer them, and use your professional judgment on whether to proceed.<\u002Fli>\n        <\u002Fol>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSection.injection }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin-bottom:10px;\">FLU-07 · SAFETY<\u002Fspan>\n        <h1 style=\"font-size:28px;margin:0 0 18px;\">Injection Site &amp; Safety<\u002Fh1>\n        <div style=\"display:flex;gap:36px;flex-wrap:wrap;align-items:flex-start;\">\n          <div style=\"flex:2;min-width:300px;\">\n            <ol>\n              <li>Ask the participant to expose their chosen upper arm and be seated, preferably in a chair with arms.<\u002Fli>\n              <li>Administer at your (the nurse's) eye level — stay seated. Have the participant relax the arm; a relaxed arm means less discomfort.<\u002Fli>\n              <li>Locate the deltoid muscle — about 2 inches below the acromion process, above the axillary fold/armpit.<\u002Fli>\n              <li>Clean the area with an alcohol wipe in a one-way circular motion.<\u002Fli>\n              <li>Insert the needle at <b>90 degrees<\u002Fb> into the thickest part of the muscle. Do not squeeze the arm.<\u002Fli>\n              <li>Inject and depress the vaccine fully, ensuring all vaccine is used.<\u002Fli>\n              <li>Flip saftey cover over the needle — needle still attached — and dispose vial and needle directly into the <b>Sharps Container<\u002Fb>.<\u002Fli>\n              <li>Apply a band-aid to the injection site.<\u002Fli>\n              <li>Document the vaccination record: site of injection and lot number (see Module 10).<\u002Fli>\n            <\u002Fol>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:220px;\">\n            <sc-raw-table class=\"table\">\n              <sc-raw-tr><sc-raw-th>Route<\u002Fsc-raw-th><sc-raw-td>Intramuscular injection<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-th>Site<\u002Fsc-raw-th><sc-raw-td>Deltoid muscle, upper arm<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-th>Landmark<\u002Fsc-raw-th><sc-raw-td>~2 in below acromion process<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n              <sc-raw-tr><sc-raw-th>Angle<\u002Fsc-raw-th><sc-raw-td>90 degrees, full depth<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <\u002Fsc-raw-table>\n            <div style=\"border-radius:var(--radius-md);overflow:hidden;margin:16px 0;\">\n              <image-slot id=\"assembly-photo\" shape=\"rect\" fit=\"contain\" style=\"width:100%;height:240px;\" placeholder=\"Drop a photo of the needle assembly step\" src=\"8d32511a-a5cc-4216-ae24-5382e19d7779\"><\u002Fimage-slot>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card\" style=\"margin:16px 0;background:var(--color-accent-2-100);\"><span class=\"card-kicker\" style=\"color:var(--color-accent-2-700);\">Important<\u002Fspan><p class=\"card-body\" style=\"color:var(--color-accent-2-800);opacity:1;\"><b>ONE pre-filled syringe/shot per individual.<\u002Fb> Manufacturer-filled syringes should never be used on more than one participant.<\u002Fp><\u002Fdiv>\n        <div class=\"card\" style=\"margin:16px 0;background:var(--color-accent-2-100);\"><span class=\"card-kicker\" style=\"color:var(--color-accent-2-700);\">Important<\u002Fspan><p class=\"card-body\" style=\"color:var(--color-accent-2-800);opacity:1;\"><b>Gloves must always be worn<\u002Fb> during administration, and changed between every participant.<\u002Fp><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSection.lotnumber }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin-bottom:10px;\">FLU-08 · DOCUMENTATION<\u002Fspan>\n        <h1 style=\"font-size:28px;margin:0 0 18px;\">Verify and Record Your Lot Number<\u002Fh1>\n        <p>For each flu shot given, we must document the date of the shot, the site of injection (left or right arm), and the lot number of the shot given. Every flu shot administrator must sign their name in the <b>Vaccine Administrator Signature<\u002Fb> box on the Flu Consent + Contraindication Form.<\u002Fp>\n        <p>The <b>lot number<\u002Fb> of a flu shot can be found in two places:<\u002Fp>\n        <ul>\n          <li>On the syringe label — the peel-away label can be removed for easier viewing.<\u002Fli>\n          <li>On the box the syringe was pulled from.<\u002Fli>\n        <\u002Ful>\n        <div style=\"display:flex;gap:16px;flex-wrap:wrap;margin:16px 0;\">\n          <div style=\"border-radius:var(--radius-md);overflow:hidden;flex:1;min-width:180px;max-width:400px;position:relative;\">\n            <image-slot id=\"lotnumber-photo\" shape=\"rect\" fit=\"contain\" style=\"{{ lotPhotoStyle }}\" placeholder=\"Drop a photo of the lot number location\" src=\"49d584f2-8b43-4461-8532-00a85f1f04f6\"><\u002Fimage-slot>\n            <button type=\"button\" sc-camel-on-click=\"{{ onOpenLotLightbox }}\" style=\"{{ enlargeBtnStyle }}\">⤢ Enlarge<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"border-radius:var(--radius-md);overflow:hidden;flex:1;min-width:160px;max-width:340px;position:relative;\">\n            <image-slot id=\"consent-photo\" shape=\"rect\" fit=\"contain\" style=\"{{ consentPhotoStyle }}\" placeholder=\"Drop a photo of the consent form\" src=\"c1ae9b46-2627-4beb-930b-d582088a4162\"><\u002Fimage-slot>\n            <button type=\"button\" sc-camel-on-click=\"{{ onOpenLightbox }}\" style=\"{{ enlargeBtnStyle }}\">⤢ Enlarge<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ lightboxOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;\" sc-camel-on-click=\"{{ onCloseLightbox }}\"><\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ onCloseLightbox }}\" style=\"position:fixed;top:24px;right:32px;z-index:1001;background:#fff;border:none;border-radius:var(--radius-md);padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;\">Close ✕<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ lotLightboxOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;\" sc-camel-on-click=\"{{ onCloseLotLightbox }}\"><\u002Fdiv>\n          <button type=\"button\" sc-camel-on-click=\"{{ onCloseLotLightbox }}\" style=\"position:fixed;top:24px;right:32px;z-index:1001;background:#fff;border:none;border-radius:var(--radius-md);padding:8px 14px;font:inherit;font-size:13px;cursor:pointer;\">Close ✕<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSection.anaphylaxis }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent-2-700);margin-bottom:10px;\">FLU-09 · EMERGENCY<\u002Fspan>\n        <h1 style=\"font-size:28px;margin:0 0 18px;\">Emergency Protocol: Anaphylactic Shock<\u002Fh1>\n        \n        <div class=\"card\" style=\"margin:16px 0;background:var(--color-accent-2-100);\"><span class=\"card-kicker\" style=\"color:var(--color-accent-2-700);\">Important<\u002Fspan><p class=\"card-body\" style=\"color:var(--color-accent-2-800);opacity:1;\">Anaphylaxis is a <b>medical emergency<\u002Fb>. Epinephrine is the first-line treatment and should be administered immediately when anaphylaxis is suspected. Delaying epinephrine increases the risk of severe complications.<\u002Fp><\u002Fdiv>\n\n        <h4 style=\"margin:26px 0 8px;\">Recognition of Anaphylaxis<\u002Fh4>\n        <p>Suspect anaphylaxis when a person develops a rapid onset (minutes to hours) of symptoms involving breathing, circulation, or multiple body systems, such as:<\u002Fp>\n        <ul>\n          <li>Difficulty breathing, wheezing, stridor, throat tightness<\u002Fli>\n          <li>Swelling of the tongue, lips, face, or throat<\u002Fli>\n          <li>Generalized hives, itching, or flushing<\u002Fli>\n          <li>Dizziness, fainting, weak pulse, low blood pressure<\u002Fli>\n          <li>Sudden gastrointestinal symptoms such as vomiting, diarrhea, or severe abdominal cramps after exposure to an allergen<\u002Fli>\n        <\u002Ful>\n\n        <h4 style=\"margin:26px 0 8px;\">Immediate Actions<\u002Fh4>\n        <p><b>1. Discontinue administration of the vaccine<\u002Fb><\u002Fp>\n        <p><b>2. Call 911 (or activate EMS)<\u002Fb><\u002Fp>\n        <ul>\n          <li>Do not leave the patient alone.<\u002Fli>\n          <li>Request advanced medical assistance immediately.<\u002Fli>\n          <li>If breathing is absent, begin CPR. Continue CPR until help arrives.<\u002Fli>\n        <\u002Ful>\n        <p><b>3. Administer epinephrine immediately<\u002Fb><\u002Fp>\n        <p>Preferred route: <b>intramuscular (IM) injection into the anterolateral thigh<\u002Fb> (outer mid-thigh).<\u002Fp>\n        <ul>\n          <li>Each flu event emergency kit provided by US Wellness contains an ampule of epinephrine, a filter straw, a syringe, and a needle.<\u002Fli>\n        <\u002Ful>\n        <sc-raw-table class=\"table\">\n          <sc-raw-tr><sc-raw-th>Form<\u002Fsc-raw-th><sc-raw-th>Adult dose<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Drawn from vial<\u002Fsc-raw-td><sc-raw-td>0.3–0.5 mg IM, using 1 mg/mL (1:1,000) epinephrine solution<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Auto-injector<\u002Fsc-raw-td><sc-raw-td>0.3 mg<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-table>\n        \n        <ul>\n          \n        <\u002Ful>\n\n        <h4 style=\"margin:26px 0 8px;\">Positioning<\u002Fh4>\n        <ul>\n          <li>If hypotensive, dizzy, or in shock: lay flat with legs elevated.<\u002Fli>\n          <li>If vomiting: place on side to reduce aspiration risk.<\u002Fli>\n          <li>If severe breathing difficulty: allow a position of comfort, but avoid standing or walking.<\u002Fli>\n        <\u002Ful>\n\n        <h4 style=\"margin:26px 0 8px;\">Adjunctive Medications<\u002Fh4>\n        <p>These do not replace epinephrine:<\u002Fp>\n        <ul>\n          <li>Antihistamines may help itching and hives.<\u002Fli>\n        <\u002Ful>\n        <p>Epinephrine remains the critical first-line therapy.<\u002Fp>\n\n        <h4 style=\"margin:26px 0 8px;\">Post-Event Care<\u002Fh4>\n        <ul>\n          <li>All patients treated with epinephrine for anaphylaxis should be transported for medical evaluation.<\u002Fli>\n          <li>Patients should be observed for recurrence of symptoms (biphasic reaction) after initial improvement.<\u002Fli>\n        <\u002Ful>\n\n        <div class=\"card\" style=\"margin:20px 0;\">\n          <span class=\"card-kicker\">Quick Reference<\u002Fspan>\n          <ol style=\"margin:8px 0 0;\">\n            <li>Recognize anaphylaxis<\u002Fli>\n            <li>Discontinue administration of the vaccine<\u002Fli>\n            <li>Call 911<\u002Fli>\n            <li>Give IM epinephrine in the outer thigh immediately<\u002Fli>\n            <li>Lay patient flat (if tolerated)<\u002Fli>\n            <li>Repeat epinephrine every 5–15 minutes if needed<\u002Fli>\n            <li>Monitor airway, breathing, circulation<\u002Fli>\n            <li>Transfer to emergency care&nbsp;<\u002Fli>\n            <li><p style=\"margin: 0\">Document the incident in Salesforce or on the provided paper incident form, then notify US Wellness On-Call.<\u002Fp><\u002Fli>\n            \n          <\u002Fol>\n        <\u002Fdiv>\n\n        <p style=\"font-size:12.5px;color:color-mix(in srgb, var(--color-text) 70%, transparent);\">This protocol is intended as an emergency response guide and does not replace local EMS, organizational policies, or physician medical direction.<\u002Fp>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSection.documentation }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin-bottom:10px;\">FLU-10 · OPERATIONS<\u002Fspan>\n        <h1 style=\"font-size:28px;margin:0 0 18px;\">Required Documentation<\u002Fh1>\n        <h4 style=\"margin:0 0 8px;\">Paper Form Documentation<\u002Fh4>\n        <p>Injection date, site of injection, vaccine administrator signature, and lot number are recorded at the bottom of the <b>US Wellness Consent Form<\u002Fb> for every participant.<\u002Fp>\n        <h4 style=\"margin:20px 0 8px;\">Tablet Documentation<\u002Fh4>\n        <p>Locate the participant's appointment and select <b>Open Test View<\u002Fb>. If they don't have an appointment, create a Contact and appointment for them. The following must be recorded into Salesforce:<\u002Fp>\n        <sc-raw-table class=\"table\">\n          <sc-raw-tr><sc-raw-th>Field<\u002Fsc-raw-th><sc-raw-th>Notes<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Pregnant (Y/N)<\u002Fsc-raw-td><sc-raw-td>Contraindication question, from paper form<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Moderately/Severely Ill Today (Y/N)<\u002Fsc-raw-td><sc-raw-td>Contraindication question, from paper form<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Flu Shot Received (Y/N)<\u002Fsc-raw-td><sc-raw-td>—<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Injection Site<\u002Fsc-raw-td><sc-raw-td>Left / Right arm<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Lot Number<\u002Fsc-raw-td><sc-raw-td>From syringe label or box<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-table>\n        <p style=\"font-size:12.5px;color:color-mix(in srgb, var(--color-text) 70%, transparent);\">Some events use paper-only documentation; your US Wellness Scheduling App will confirm whether tablet technology applies — this is also reviewed during training.<\u002Fp>\n        <div class=\"card\" style=\"margin:16px 0;background:var(--color-accent-2-100);\"><span class=\"card-kicker\" style=\"color:var(--color-accent-2-700);\">Important<\u002Fspan><p class=\"card-body\" style=\"color:var(--color-accent-2-800);opacity:1;\"><b>Participant should leave with the yellow copy<\u002Fb> of their paper form, as proof of their flu shot record. US Wellness keeps the white copy. Participant must also leave with a <b>US Wellness Wallet Vaccination Card<\u002Fb>.<\u002Fp><\u002Fdiv>\n        <div style=\"border-radius:var(--radius-md);overflow:hidden;margin:16px 0;max-width:400px;\">\n          <image-slot id=\"documentation-photo\" shape=\"rect\" fit=\"contain\" style=\"width:100%;height:240px;\" placeholder=\"Drop a photo of the Wallet Vaccination Card\" src=\"308f30d1-22f7-4b8e-92ee-5ea02c826f5f\"><\u002Fimage-slot>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSection.salesforce }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin-bottom:10px;\">FLU-11 · OPERATIONS<\u002Fspan>\n        <h1 style=\"font-size:28px;margin:0 0 18px;\">Salesforce Data Entry<\u002Fh1>\n        <p>Learn how to locate appointments, enter screening results, and complete participant records in Salesforce during a US Wellness event.<\u002Fp>\n        <div class=\"card\" style=\"margin:16px 0;\">\n          <span class=\"card-kicker\">Training Video<\u002Fspan>\n          <p class=\"card-body\" style=\"margin-bottom:8px;\">Watch the full Salesforce data entry walkthrough before your first event.<\u002Fp>\n          <a href=\"https://www.youtube.com/watch?v=as3_WnzJyXU\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-block;font-size:14px;font-weight:600;\">▶ Watch on YouTube<\u002Fa>\n        <\u002Fdiv>\n        <h4 style=\"margin:20px 0 8px;\">Key Reminders<\u002Fh4>\n        <ul>\n          <li>Always locate the participant's appointment in Salesforce before entering any data.<\u002Fli>\n          <li>Verify full name and date of birth before saving results.<\u002Fli>\n          <li>Enter all results promptly and accurately — do not wait until the end of the event.<\u002Fli>\n          <li>If you encounter a technical issue, contact your on-call support line: <b>866.881.7607<\u002Fb>.<\u002Fli>\n        <\u002Ful>\n        <h4 style=\"margin:26px 0 8px;\">Required Self-Answer Questions in Salesforce<\u002Fh4>\n        <div style=\"border-radius:var(--radius-md);overflow:hidden;margin:12px 0;\">\n          <image-slot id=\"salesforce-selfanswer\" shape=\"rect\" fit=\"contain\" style=\"width:100%;height:320px;\" placeholder=\"Drop a screenshot of the required self-answer questions\" src=\"b1a2b986-e2e0-4c33-a69f-ba001cc78bbe\"><\u002Fimage-slot>\n        <\u002Fdiv>\n        <h4 style=\"margin:26px 0 8px;\">Data Fields collected in Salesforce<\u002Fh4>\n        <div style=\"border-radius:var(--radius-md);overflow:hidden;margin:12px 0;\">\n          <image-slot id=\"salesforce-datafields\" shape=\"rect\" fit=\"contain\" style=\"width:100%;height:320px;\" placeholder=\"Drop a screenshot of the Salesforce data fields\" src=\"f4ae1c02-01c5-4fa9-bdf5-57447f3e8849\"><\u002Fimage-slot>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSection.shippingchart }}\" hint-placeholder-val=\"{{ false }}\">\n        <span style=\"display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 70%, transparent);margin-bottom:10px;\">FLU-12 · REFERENCE<\u002Fspan>\n        <h1 style=\"font-size:28px;margin:0 0 18px;\">US Wellness Flu Vaccine Storage<\u002Fh1>\n        <sc-raw-table class=\"table\">\n          <sc-raw-tr><sc-raw-th>Item<\u002Fsc-raw-th><sc-raw-th>Notes<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Vaccine<\u002Fsc-raw-td><sc-raw-td>Remove vaccine from cooler and place in a refrigerator.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Ice packs<\u002Fsc-raw-td><sc-raw-td>Remove ice packs from cooler and place in freezer.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-td>Ancillary flu supplies (band-aids, needles, gauze, etc.)<\u002Fsc-raw-td><sc-raw-td>Can remain in shipping boxes once items are compared to packlist.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-table>\n        <div style=\"display:flex;gap:24px;flex-wrap:wrap;margin:16px 0;align-items:center;\">\n          <div style=\"border-radius:var(--radius-md);overflow:hidden;flex:1;min-width:220px;max-width:340px;\">\n            <image-slot id=\"shippingchart-photo-1\" shape=\"rect\" fit=\"contain\" style=\"width:100%;height:220px;\" placeholder=\"Drop a photo of the sealed cooler\" src=\"2d7862ba-2d20-43dc-9318-6ce17e221d76\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <p style=\"flex:1;min-width:180px;\">All vaccine comes in a sealed cooler.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-radius:var(--radius-md);overflow:hidden;margin:16px 0;max-width:400px;\">\n          <image-slot id=\"shippingchart-photo-2\" shape=\"rect\" fit=\"contain\" style=\"width:100%;height:240
